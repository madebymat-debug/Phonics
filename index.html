<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan's Phonics practice</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phonics">
<meta name="theme-color" content="#FFF3C4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3C4; --dot:#FFE08A; --ink:#1B1F3B; --card:#FFFFFF; --muted:#5A5F7A; --edge:#1B1F3B; --soft:#EFE6C6;
  --blue:#2F6BFF; --green:#16A34A; --red:#EF4444; --alien:#7C3AED; --pink:#FF3D9A; --orange:#FF8A00; --teal:#0EA5A4;
  --blue-ink:#2457E0; --green-ink:#15803D; --red-ink:#DC2626; --alien-ink:#6D28D9;
  --t-sounds:#DCE8FF; --t-green:#D8F6E2; --t-red:#FFE0E0;
  --mark:#FF8A00; --hl:#FFE066;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A33; --dot:#1E2650; --ink:#F3F4FF; --card:#1F2750; --muted:#A9B0D6; --edge:#070A18; --soft:#2A3366;
    --blue-ink:#8AB0FF; --green-ink:#4ADE80; --red-ink:#FF8080; --alien-ink:#C4B5FD;
    --t-sounds:#1D2D66; --t-green:#113D26; --t-red:#4A1A22; --hl:#7A5B00; --mark:#FFB020;
  }
}
:root[data-theme="dark"]{
  --bg:#141A33; --dot:#1E2650; --ink:#F3F4FF; --card:#1F2750; --muted:#A9B0D6; --edge:#070A18; --soft:#2A3366;
  --blue-ink:#8AB0FF; --green-ink:#4ADE80; --red-ink:#FF8080; --alien-ink:#C4B5FD;
  --t-sounds:#1D2D66; --t-green:#113D26; --t-red:#4A1A22; --hl:#7A5B00; --mark:#FFB020;
}
*,*::before,*::after{box-sizing:border-box}
html{touch-action:manipulation;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 2.2px);background-size:22px 22px;
  font-family:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.slot,.done .sticker{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.done .sticker.wig{animation:wig .5s ease}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 28px;min-height:100%}

/* chunky sticker style */
.act,.go,.ghost,.mbtn,.chip,.toggle,.seg button,.stage{border:3px solid var(--edge);transition:transform .08s,box-shadow .08s}
.act,.go,.ghost,.mbtn{box-shadow:0 5px 0 var(--edge)}
.chip,.toggle,.seg button{box-shadow:0 3px 0 var(--edge)}
.act:active,.go:active:not(:disabled),.ghost:active,.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.chip:active,.toggle:active,.seg button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}

/* Home */
.title{font-size:clamp(1.9rem,8.6vw,2.6rem);line-height:1.05;margin:16px 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px;font-size:1.05rem}
.acts{display:flex;flex-direction:column;gap:14px}
.act{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--c,var(--card));color:#fff;border-radius:22px;padding:14px 16px}
.act[data-act=sounds]{--c:var(--blue)} .act[data-act=green]{--c:var(--green)}
.act[data-act=red]{--c:var(--red)} .act[data-act=alien]{--c:var(--alien)}
.again-row{--c:var(--orange)} #prog{--c:var(--pink)} #stk{--c:#E89A00} #addw{--c:var(--teal)}
.act .sw{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:700;
  background:rgba(255,255,255,.24)!important;color:#fff!important}
.act h2{margin:0;font-size:1.35rem}
.act p{margin:2px 0 0;color:rgba(255,255,255,.92);font-size:.98rem}
.foot{margin-top:28px;text-align:center}
.sfx-row{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:14px 16px;
  background:var(--card);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);text-align:left}
.sfx-ic{font-size:1.5rem;width:30px;text-align:center}
.sfx-lb{flex:1;font-size:1.2rem;font-weight:700}
.sw-track{flex:none;position:relative;width:64px;height:36px;border-radius:999px;background:var(--soft);border:3px solid var(--edge);transition:background .2s}
.sw-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--edge);transition:transform .2s}
.sfx-row[aria-checked="true"] .sw-track{background:var(--green)}
.sfx-row[aria-checked="true"] .sw-knob{transform:translateX(28px)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px}

/* Setup */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{background:none;border:0;font-size:1.1rem;padding:10px 4px;color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.ghead{font-size:1rem;color:var(--muted);margin:22px 0 10px;font-weight:700}
.chip{background:var(--card);border-radius:999px;padding:10px 18px;font-size:1.1rem}
.cset{display:block;font-size:.78rem;font-weight:700;opacity:.7;margin-top:1px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.go{width:100%;border-radius:18px;padding:18px;font-size:1.35rem;font-weight:700;color:#fff;background:var(--green)}
.go:disabled{opacity:.45}
.hint{color:var(--muted);font-size:1rem;line-height:1.5;margin:0}

/* Practice */
.count{color:var(--ink);font-size:1.05rem;font-weight:700}
.prog{height:12px;background:var(--soft);border:2px solid var(--edge);border-radius:8px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),#FFD23F);transition:width .3s}
.stage{background:var(--card);border-radius:30px;box-shadow:0 6px 0 var(--edge);min-height:58vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;
  position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.stage.m-sounds{background:var(--t-sounds)}
.stage.m-green{background:var(--t-green)}
.stage.m-red{background:var(--t-red)}
.stage.m-alien{--alien:#C4F25E;--mark:#FFD23F;background-color:#2A1366;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 78% 12%,#fff 50%,transparent 52%),
  radial-gradient(2px 2px at 88% 64%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 22% 80%,#fff 50%,transparent 52%),
  radial-gradient(2.5px 2.5px at 60% 88%,#FFD23F 50%,transparent 52%),radial-gradient(1.5px 1.5px at 40% 8%,#fff 50%,transparent 52%),
  radial-gradient(2px 2px at 6% 52%,#FFD23F 50%,transparent 52%),radial-gradient(120px 120px at 85% 100%,#4C1D95,transparent)}
.stage.tap{cursor:pointer}
.stage.slide{animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.big{display:inline-block;line-height:1;color:var(--blue-ink);font-size:100px}
.big.split{position:relative;padding-top:.12em}
.big.split::before{content:"";position:absolute;left:.24em;right:.24em;top:0;height:.24em;border:.055em solid currentColor;border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0}
.ex{margin-top:14px;color:var(--muted);font-size:1.1rem}
.word{position:relative;display:inline-flex;justify-content:center;font-size:100px;line-height:1}
.gp{display:inline-flex;flex-direction:column;align-items:center;padding:0 .02em;border-radius:.14em;transition:background .15s}
.gp .l{display:block;padding:.04em .03em 0}
.gp.on{background:var(--hl)}
.m-alien .gp.on{background:rgba(255,255,255,.2)}
.mk{display:block;height:.26em;width:100%;position:relative}
.mk.dot::after{content:"";position:absolute;left:50%;top:.08em;width:.14em;height:.14em;margin-left:-.07em;border-radius:50%;background:var(--mark)}
.mk.dash::after{content:"";position:absolute;left:14%;right:14%;top:.1em;height:.1em;border-radius:.05em;background:var(--mark)}
.arcs{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.arcs path{fill:none;stroke:var(--mark);stroke-width:6;stroke-linecap:round}
.head .mk::after,.head .arcs{visibility:hidden}
.word.green .l{color:var(--green-ink)}
.word.alien .l{color:var(--alien-ink)}
.m-alien .word.alien .l{color:var(--alien)}
.word.red .l{color:var(--red-ink)}
.word.blend .gp{background:none}
.word.blend .l{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em}
.alien-pic{width:84px;height:84px;margin-bottom:6px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

.step{margin-top:18px;color:var(--muted);font-size:1.05rem;font-weight:700;min-height:1.5em;text-align:center}
.m-alien .step{color:#D8CCFF}
.tools{display:flex;justify-content:center;margin:16px 0 0}
.toggle{background:var(--card);border-radius:999px;padding:8px 16px;font-size:.98rem;color:var(--ink)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.mbtn{border-radius:20px;padding:20px 10px;font-size:1.25rem;font-weight:700}
.mbtn.again{background:var(--card);color:var(--ink)}
.mbtn.got{background:var(--green);color:#fff}

/* Done */
.done{text-align:center;padding-top:40px}
.done .star{font-size:5rem;display:inline-block;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.done h2{font-size:2.3rem;margin:10px 0 6px}
.done p{color:var(--muted);font-size:1.15rem;margin:0 0 26px}
.stack{display:flex;flex-direction:column;gap:14px}
.ghost{width:100%;background:var(--card);border-radius:18px;padding:16px;font-size:1.15rem;font-weight:700}
.missed{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:-10px 0 26px}
.missed span{background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:4px 12px;font-size:1.4rem}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}

/* Family sync */
.pill{flex:none;font-size:.95rem;font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid var(--edge);background:var(--soft)}
.pill[data-s="ok"],.pill[data-s="idle"]{background:var(--green);color:#fff}
.pill[data-s="error"]{background:var(--orange);color:#fff}
.tip{margin-top:14px;background:var(--card);border:2px dashed var(--edge);border-radius:14px;padding:10px 12px;color:var(--ink)}
.codebox{margin-top:22px;text-align:center;white-space:nowrap;font-size:clamp(1.4rem,7.4vw,2.4rem);font-weight:700;letter-spacing:.06em;
  background:var(--card);border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:18px 10px;user-select:all}
/* Insights */
.ins{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 var(--edge)}
.ins-t{flex:1;font-size:1rem;line-height:1.4}
.ins-t b{font-size:1.2rem;color:var(--blue-ink)}
.ins-b{flex:none;border:3px solid var(--edge);background:var(--green);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:0 3px 0 var(--edge)}
.ins-b:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
/* Stickers */
.earned{font-size:1.4rem;font-weight:700;color:var(--orange);margin-top:4px}
.done .sticker{font-size:6rem}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.slot{aspect-ratio:1;border:3px solid var(--edge);border-radius:16px;background:var(--card);display:grid;place-items:center;
  font-size:clamp(2.4rem,13vw,3.6rem);line-height:1;position:relative;padding:0;box-shadow:0 3px 0 var(--edge)}
.slot.empty{border-style:dashed;box-shadow:none;background:transparent;color:var(--muted);font-size:1.6rem;font-weight:700}
.slot .n{position:absolute;top:-9px;right:-9px;background:var(--pink);color:#fff;border:2px solid var(--edge);border-radius:999px;font-size:.72rem;padding:1px 6px;font-weight:700}
.slot.wig{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.15)}75%{transform:rotate(12deg) scale(1.15)}}
.stage.is-tricky::before{content:"🔁 Tricky one";position:absolute;top:12px;left:14px;font-size:.85rem;font-weight:700;color:var(--muted);
  background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:2px 10px}
.m-alien.is-tricky::before{color:var(--ink)}
/* Logo */
.logo{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--edge);margin:8px 0 8px;height:200px;display:grid;place-items:center}
.lg-bg{position:absolute;inset:0;width:100%;height:100%}
.lg-txt{position:relative;text-align:center;z-index:2;margin-top:-14px}
.lg-dy,.lg-ph{font-weight:700;line-height:1;--o:#1B1F3B;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px 2px var(--o),2px -2px var(--o),-2px -2px var(--o),0 6px 0 var(--o)}
.lg-dy{font-size:2rem;transform:rotate(-5deg);display:inline-block;margin-bottom:2px}
.lg-ph{font-size:clamp(3rem,15.5vw,4.4rem);letter-spacing:.02em}
.lg-ph span,.lg-dy span{display:inline-block}
.lg-ph span:nth-child(odd){transform:translateY(-3px) rotate(-3deg)} .lg-ph span:nth-child(even){transform:translateY(2px) rotate(3deg)}
.lg-pr{display:inline-block;margin-top:8px;background:#FF3D9A;color:#fff;font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 14px;border:3px solid #1B1F3B;border-radius:10px;box-shadow:0 3px 0 #1B1F3B;transform:rotate(2deg)}
.lg-c{position:absolute;z-index:1}
.lg-al{width:74px;left:-8px;bottom:-14px;transform:rotate(-10deg)}
.lg-ch{width:70px;right:-6px;bottom:-12px;transform:rotate(10deg);animation:lgrock 2.6s ease-in-out infinite}
@keyframes lgrock{0%,100%{transform:rotate(10deg) translateY(0)}30%{transform:rotate(18deg) translateY(-5px)}60%{transform:rotate(4deg) translateY(-2px)}}
.lg-sp{width:52px;right:14px;top:10px;transform:rotate(8deg);animation:bob 2.8s ease-in-out infinite}
.lg-al{animation:lgbob 3.2s ease-in-out infinite}
@keyframes lgbob{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-6px)}}
.logo + .sub{text-align:center;margin-top:10px}
/* Child mode */
body.kid .adult-only{display:none!important}
.kid-only{display:none}
body.kid .kid-only{display:block}
.kidm{grid-template-columns:1fr}
.kidm .mbtn{font-size:1.6rem;padding:22px 10px}
.gate .disp{font-size:2.2rem;font-weight:700;min-height:3.2rem;line-height:1.3;border:3px solid var(--edge);border-radius:14px;margin:6px 0 14px;background:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{font-size:1.45rem;font-weight:700;padding:12px 0;border:3px solid var(--edge);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--edge)}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.keys .ok{background:var(--green);color:#fff}
.gate.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.kid-badge{display:none}
body.kid .kid-badge{display:inline-block;margin-top:6px;font-weight:700;color:var(--muted)}
/* Rewards */
.slot.shiny{border-color:#FF3D9A;background:linear-gradient(135deg,#FFE3F1,#E3F0FF 50%,#FFF6C8);box-shadow:0 3px 0 var(--edge),0 0 0 3px #FFD23F inset}
.slot.shiny::after{content:"✨";position:absolute;left:-8px;top:-10px;font-size:1.1rem;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15) rotate(15deg);opacity:1}}
.slot.empty.locked{opacity:.45;font-size:1.2rem}
.season{margin:-4px 0 10px;font-weight:700;color:var(--muted);font-size:.95rem}
.season.now{color:var(--orange)}
.pop.shiny{background:linear-gradient(135deg,#FFE3F1,#E3F0FF 50%,#FFF6C8)}
.pop.shiny h2,.pop.shiny p{color:#2A2A3A}
.pop.season-pop{background:linear-gradient(160deg,#FFE7C2,#FFB347)}
.pop.season-pop h2,.pop.season-pop p{color:#2A1A00}

.slot.tr{border-color:#7D8FB8;background:linear-gradient(160deg,#F4F7FF,#D3DCEF)}
.slot.tg{border-color:#B98500;background:linear-gradient(160deg,#FFF6C8,#FFCF3F)}
.slot.empty.tr{background:transparent;border-color:#7D8FB8;color:#7D8FB8}
.slot.empty.tg{background:transparent;border-color:#B98500;color:#B98500}
.kb{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:2px solid var(--edge)}
.kb.tr{background:linear-gradient(160deg,#F4F7FF,#D3DCEF)} .kb.tg{background:linear-gradient(160deg,#FFF6C8,#FFCF3F)}
.pghead{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem;margin:26px 0 10px}
.pghead span:last-child{color:var(--muted);font-size:1rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.tabs .chip{font-weight:700}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tcard{background:var(--card);border:3px solid var(--edge);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 3px 0 var(--edge)}
.tcard .ti{font-size:2.6rem;line-height:1.1}
.tcard h4{margin:6px 0 3px;font-size:1.02rem}
.tcard p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.3}
.tcard .td{margin-top:6px;font-weight:700}
.tcard.special:not(.locked){background:linear-gradient(160deg,#FFF6C8,#FFCF3F)}
.tcard.special:not(.locked) h4,.tcard.special:not(.locked) p{color:#3A2A00}
.tcard.locked{box-shadow:none;border-style:dashed;background:transparent}
.tcard.locked .ti{filter:grayscale(1);opacity:.35}
.earned.tr{color:#5B6E9C} .earned.tg{color:#B98500}
.done .sticker.tr,.done .sticker.tg{border-radius:50%;padding:14px;border:4px solid var(--edge)}
.done .sticker.tr{background:linear-gradient(160deg,#F4F7FF,#D3DCEF)}
.done .sticker.tg{background:linear-gradient(160deg,#FFF6C8,#FFCF3F)}
.pop-bg{position:fixed;inset:0;background:rgba(10,14,40,.55);display:grid;place-items:center;z-index:20;padding:20px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pop{background:var(--card);border:4px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);padding:26px 22px;text-align:center;max-width:340px;width:100%;animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pop .pi{font-size:5.5rem;line-height:1;display:inline-block;animation:wig 1s ease .35s}
.pop .pk{font-weight:700;color:var(--orange);font-size:1.05rem;margin-top:10px;text-transform:uppercase;letter-spacing:.05em}
.pop h2{margin:4px 0 8px;font-size:1.8rem}
.pop p{color:var(--muted);margin:0 0 20px;font-size:1.1rem;line-height:1.4}
.pop.gold{background:linear-gradient(160deg,#FFF6C8,#FFCF3F)}

// Typed entry -> internal format. "c a-e k" => "c a_ k _e"
function toInternal(input,type){
  const raw=input.trim().toLowerCase().replace(/\s+/g," ");
  if(!raw) return {err:""};
  if(type==="red"){
    const w=input.trim().replace(/\s+/g," ");
    if(!/^[A-Za-z' ]+$/.test(w)) return {err:"Letters only"};
    return {s:w.replace(/ /g,"")};
  }
  if(!/^[a-z \-_]+$/.test(raw)) return {err:"Letters only, with spaces between sounds"};
  const toks=raw.split(" "), out=[]; let pend=false, splits=0;
  for(const t of toks){
    const m=t.match(/^([aeiou])[-_]e$/);
    if(m){ if(pend) return {err:"Only one split digraph per word"}; out.push(m[1]+"_"); pend=true; splits++; continue }
    if(/[-_]/.test(t)) return {err:"Write split digraphs like a-e, i-e, o-e, u-e"};
    out.push(t);
    if(pend){out.push("_e");pend=false}
  }
  if(pend) return {err:"A split digraph needs a sound after it, e.g. c a-e k"};
  if(splits>1) return {err:"Only one split digraph per word"};
  const warn=toks.length===1&&raw.length>2?"Tip: put a space between each sound":"";
  return {s:out.join(" "),warn};
}

  const today=new Date(); today.setHours(0,0,0,0);

// ---------- Insights: which sounds / word types he finds harder ----------
function featuresOf(it){
  if(!it.str) return [];
  const f=parse(it.str);
  const gs=f.sounds.map(ix=>ix.length===2?f.tokens[ix[0]].g+"-"+f.tokens[ix[1]].g:f.tokens[ix[0]].g).filter(g=>/^[a-z-]+$/.test(g));
  const feats=new Set(gs.map(g=>"g:"+g)), C=/^[bcdfghjklmnpqrstvwxyz]$/;
  for(let i=0;i<gs.length-1;i++) if(C.test(gs[i])&&C.test(gs[i+1])){feats.add("blend");break}
  if(f.sounds.length>=5) feats.add("long");
  return [...feats];
}
function insights(){
  const stat={}, sp={}; let tot=0, miss=0;
  for(const id in S.h){
    const it=ALL[id], h=S.h[id]; if(!it) continue;
    const n=(h.g||0)+(h.a||0), a=h.a||0; if(!n) continue;
    if(it.mode==="sounds"){const s=sp[it.g]||(sp[it.g]={n:0,a:0}); s.n+=n; s.a+=a; continue}
    if(!it.str) continue;
    tot+=n; miss+=a;
    for(const f of featuresOf(it)){const s=stat[f]||(stat[f]={n:0,a:0,w:0}); s.n+=n; s.a+=a; s.w++}
  }
  const base=tot?miss/tot:0, out=[];
  for(const f in stat){
    const s=stat[f], r=s.a/s.n;
    if(s.w<3||s.n<5||s.a<3||r<Math.max(base*1.5,0.3)) continue;
    const g=f.startsWith("g:")?f.slice(2):null, spc=g&&sp[g], spT=!!(spc&&spc.a>=2&&spc.a/spc.n>=0.4);
    const label=g?`Words with <b>${esc(g)}</b>`:f==="blend"?`Words with blends like <b>fr</b>, <b>st</b>, <b>mp</b>`:`Longer words (<b>5+</b> sounds)`;
    out.push({key:f,score:(r-base)*Math.sqrt(s.n)+(spT?0.5:0),short:g||(f==="blend"?"blends":"longer words"),
      html:`${label}: missed ${Math.round(r*100)}% of the time, compared with ${Math.round(base*100)}% overall.${spT?` The <b>${esc(g)}</b> Speed Sounds card is tricky too.`:""}`});
  }
  for(const g in sp){
    const s=sp[g]; if(s.n<3||s.a<2||s.a/s.n<0.4||out.some(o=>o.key==="g:"+g)) continue;
    out.push({key:"g:"+g,score:(s.a/s.n)*Math.sqrt(s.n)*0.8,short:g,html:`The <b>${esc(g)}</b> Speed Sounds card: missed ${s.a} of ${s.n} times.`});
  }
  out.sort((a,b)=>b.score-a.score);
  return {list:out.slice(0,3),enough:tot>=30};
}
function itemsFor(key){
  const g=key.startsWith("g:")?key.slice(2):null, all=Object.values(ALL);
  const cards=g?all.filter(it=>it.mode==="sounds"&&it.g===g):[];
  return [...cards,...all.filter(it=>(it.mode==="green"||it.mode==="alien")&&featuresOf(it).includes(key))];
}

function start(items,label){
  items=items.filter((it,i,a)=>a.findIndex(x=>x.id===it.id)===i);

function nextBatch(){
  let deck=P.pool.slice(P.off,P.off+SESSION);
  if(P.mix&&deck.length){
    // mix up to 3 tricky ones from earlier sessions into this batch
    const extra=pickTricky(deck[0].mode,new Set(deck.map(it=>it.id)),3);
    deck=deck.slice(0,Math.min(deck.length,SESSION-extra.length));
    P.off+=deck.length;
    extra.forEach(it=>P.trickyIds.add(it.id));
    deck=shuffle([...deck,...extra]);

    const changed=JSON.stringify(m)!==before;
    if(changed) buildItems();
    await rpc("save_family",{p_code:S.family,p_data:m});
    SYNC.state="ok";
    if(changed&&!P&&VIEW) VIEW();
  }catch(e){SYNC.state="error"; SYNC.err=String(e&&e.message||e)}
  syncing=false; updSyncUI();
  if(syncAgain){syncAgain=false;syncNow()}
}
function queueSync(){if(!S.family)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1200)}
function pillText(){return !S.family?"Off":SYNC.state==="syncing"?"Syncing…":SYNC.state==="error"?"Not synced":"On"}
function lastSyncText(){
  if(SYNC.state==="error") return "Couldn't sync ("+(SYNC.err||"unknown")+"). Check your signal. If it keeps happening, the Supabase project may be paused.";
  if(!S.lastSync) return "Not synced yet";
  return "Last synced "+dayLabel(S.lastSync)+" at "+new Date(S.lastSync).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
function updSyncUI(){
  const pl=$("#syncpill"); if(pl){pl.textContent=pillText();pl.dataset.s=!S.family?"off":SYNC.state}
  const st=$("#syncstat"); if(st) st.textContent=SYNC.state==="syncing"?"Syncing…":lastSyncText();
}
const CODE_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genCode(){const a=new Uint32Array(12);crypto.getRandomValues(a);return [...a].map(n=>CODE_ABC[n%CODE_ABC.length]).join("")}
const normCode=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmtCode=c=>c.match(/.{1,4}/g).join("-");

function joinLink(){return location.origin+location.pathname+"?join="+S.family}
let PENDING_JOIN=null;
(()=>{try{const q=new URLSearchParams(location.search), j=q.get("join"), f=q.get("fam");
  if(j){PENDING_JOIN=normCode(j); history.replaceState(null,"",location.pathname)}
  // Opened with a saved family code (e.g. a home-screen copy): link automatically,
  // unless syncing was deliberately stopped on this device
  if(f&&!S.family&&!S.famOff){S.family=normCode(f); SYNC.state="idle"}
  save();}catch(e){}})();
function familyScreen(){
  VIEW=familyScreen; CUR=null;
  if(!S.family&&PENDING_JOIN){
    // Opened from a shared link: one simple choice, nothing else to get wrong
    app.innerHTML=`
    <div class="bar"><button class="back" id="back">‹ Home</button></div>
    <h1 class="title">Join the family</h1>
    <p class="hint">You've been invited to share Dylan's stickers, words and progress on this device.</p>
    <div class="codebox">${fmtCode(PENDING_JOIN)}</div>
    <button class="go" id="join1" style="margin-top:22px">Join</button>
    <div class="warn" id="fmsg" aria-live="polite"></div>`;
    $("#back").onclick=()=>{PENDING_JOIN=null;home()};
    $("#join1").onclick=async()=>{
      const c=PENDING_JOIN, msg=$("#fmsg"); $("#join1").disabled=true;
      msg.style.color="var(--muted)"; msg.textContent="Joining…";
      try{
        const r=await rpc("get_family",{p_code:c});
        if(!r){msg.style.color="";msg.textContent="That link doesn't seem to work. Ask for a new one.";$("#join1").disabled=false;return}
        S.family=c; S.famOff=false; PENDING_JOIN=null; save(); await syncNow(); familyScreen();
      }catch(e){msg.style.color="";msg.textContent="Couldn't connect ("+String(e&&e.message||e)+"). Check the internet connection and try again.";$("#join1").disabled=false}
    };
  } else if(!S.family){
    app.innerHTML=`
    <div class="bar"><button class="back" id="back">‹ Home</button></div>
    <h1 class="title">Family sync</h1>
    <p class="hint">Keep added words, progress and stickers the same on both your phones.</p>
    <h3 class="ghead">First phone</h3>
    <button class="go" id="create">Start family sync</button>
    <h3 class="ghead">Already started on another phone?</h3>
    <input class="inp" id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    <button class="ghost" id="join" style="margin-top:12px">Join with this code</button>
    <div class="warn" id="fmsg" aria-live="polite"></div>`;
    $("#back").onclick=home;
    $("#create").onclick=async()=>{S.family=genCode();S.famOff=false;save();$("#create").disabled=true;await syncNow();familyScreen()};
    $("#join").onclick=async()=>{
      const c=normCode($("#code").value), msg=$("#fmsg");
      if(c.length!==12){msg.textContent="Codes are 12 letters and numbers";return}
      msg.style.color="var(--muted)"; msg.textContent="Checking…";
      try{
        const r=await rpc("get_family",{p_code:c});
        if(!r){msg.style.color="";msg.textContent="Code not found. Check it and try again.";return}
        S.family=c; S.famOff=false; PENDING_JOIN=null; save(); await syncNow(); familyScreen();
      }catch(e){msg.style.color="";msg.textContent="Couldn't connect ("+String(e&&e.message||e)+"). Check your signal and try again."}
    };
  } else {
    app.innerHTML=`
    <div class="bar"><button class="back" id="back">‹ Home</button></div>
    <h1 class="title">Family sync</h1>
    <p class="hint">On. Share the link, or enter this code on another device to link it.</p>
    ${PENDING_JOIN&&PENDING_JOIN!==S.family?`<p class="warn" style="text-align:left">That link is for a different family code. Tap "Stop syncing on this phone" first if you want to switch.</p>`:""}
    <div class="codebox">${fmtCode(S.family)}</div>
    <p class="hint" id="syncstat" style="text-align:center;margin-top:10px">${lastSyncText()}</p>
    ${!(navigator.standalone||matchMedia("(display-mode: standalone)").matches)?`<p class="hint tip">📱 On iPhone? Add the app to your Home Screen from this page (Share › Add to Home Screen) and it will stay linked.</p>`:""}
    <div class="stack" style="margin-top:20px">
      <button class="go" id="share">Share link</button>
      <button class="ghost" id="copy">Copy link</button>
      <button class="ghost" id="now">Sync now</button>
    </div>
    <div class="foot"><button class="link" id="off">Stop syncing on this phone</button></div>`;
    $("#back").onclick=home;
    $("#share").onclick=async()=>{
      const url=joinLink(), text="Tap to open Dylan's Phonics and join our family sync (code "+fmtCode(S.family)+")";
      try{ if(navigator.share) await navigator.share({title:"Dylan's Phonics",text,url}); else {await navigator.clipboard.writeText(url); $("#share").textContent="Link copied!"} }catch(e){}
    };
    $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(joinLink()); $("#copy").textContent="Copied!"}catch(e){}};
    $("#now").onclick=syncNow;
    $("#off").onclick=()=>{if(confirm("Stop syncing on this phone? Everything stays on this phone, it just stops sharing.")){S.family=null;S.famOff=true;SYNC.state="off";save();familyScreen()}};
  }
}
window.addEventListener("online",syncNow);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow()});
setTimeout(syncNow,600);

// Quietly award trophies already earned before this feature existed
if(!S.tInit){checkTrophies(); S.tInit=1; save()}
applyKid();
home();
if(PENDING_JOIN&&PENDING_JOIN!==S.family) familyScreen();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
